  <script>
    const DOCS = {
      "WIKI-01": {
        group: "wiki",
        title: "刑法三階層犯罪審查體系",
        law: "犯罪論基礎架構",
        sources: ["SRC-06", "SRC-01"],
        slides: [2],
        tldr: "判斷一個人有沒有犯罪，刑法會依序檢查「像不像犯罪（構成要件）→ 有沒有正當理由（違法性）→ 能不能怪他（罪責）」三道關卡。",
        body: `
          <h2>三道關卡拆解</h2>
          <ol>
            <li><strong>第一關：構成要件該當性（T）</strong> — 行為外觀是否符合刑法條文寫的犯罪樣子（例：揮拳打傷人符合刑法 §277 傷害罪外觀）。</li>
            <li><strong>第二關：違法性（R）— 阻卻違法事由的主戰場</strong> — 只要成立阻卻違法事由，行為立刻翻盤成為<strong>合法、不罰</strong>，直接無罪結案。</li>
            <li><strong>第三關：罪責（S）</strong> — 若前兩關皆成立（行為確實違法），最後才檢視個人因素（年齡、精神狀態或防衛／避難過當）是否減輕或免除其刑。</li>
          </ol>
          <h2>生活化正反案例</h2>
          <div class="case-grid">
            <div class="case-card ok">
              <h4>✅ 第二關翻盤（阻卻違法）</h4>
              <p>歹徒持刀衝向小華，小華推倒對方致擦傷。外觀像傷害，但成立正當防衛 → <strong>行為合法、不罰</strong>。</p>
            </div>
            <div class="case-card warn">
              <h4>⚠️ 留在第三關（減輕罪責）</h4>
              <p>歹徒已倒地失去反抗能力，小華仍補踹三腳（防衛過當）。行為仍屬<strong>違法</strong>，只能在第三關依 §23 但書減輕或免除其刑。</p>
            </div>
          </div>
          <h2>給新手的核心提醒</h2>
          <blockquote><strong>阻卻違法 ≠ 阻卻罪責</strong>：前者是「法律說你做得對、允許你做」；後者是「你做錯了，但體諒當下處境而減刑或原諒」。</blockquote>
        `,
        seeAlso: ["WIKI-02", "WIKI-03", "WIKI-04", "WIKI-05"]
      },
      "WIKI-02": {
        group: "wiki",
        title: "正當防衛與防衛過當",
        law: "刑法第 23 條",
        sources: ["SRC-01", "SRC-02"],
        slides: [3, 6],
        tldr: "面對「正在發生」的不法攻擊，出於保護自己或他人而反擊，屬於「正對不正」，法律允許且不罰。",
        body: `
          <h2>條文原文</h2>
          <blockquote>刑法第 23 條：「對於現在不法之侵害，而出於防衛自己或他人權利之行為，不罰。但防衛行為過當者，得減輕或免除其刑。」</blockquote>
          <h2>成立要件拆解</h2>
          <ul>
            <li><strong>現在不法侵害</strong>：侵害必須「迫在眉睫」或「正在進行」。還沒發生（先下手為強）或已結束（事後報復）都不算。</li>
            <li><strong>防衛必要性</strong>：足以有效終結侵害，且在同樣有效手段中選擇損害較小者。依<strong>最高法院 108 台上 62、112 台上 537 判決</strong>，正當防衛是「正對不正」，<strong>不以「不得已（唯一手段）」為必要</strong>。</li>
            <li><strong>防衛意思</strong>：主觀上出於保護權利之意思，而非報復或互毆。</li>
          </ul>
          <h2>生活化正反案例</h2>
          <div class="case-grid">
            <div class="case-card ok">
              <h4>✅ 成立正當防衛</h4>
              <p>深夜遭歹徒持棍揮打，順手拿雨傘格擋並推倒歹徒後逃離 → 合法、不罰。</p>
            </div>
            <div class="case-card no">
              <h4>❌ 互毆不成立</h4>
              <p>雙方口角約好「來單挑」互毆掛彩 → 雙方皆具傷害故意、缺防衛意思，均不可主張正當防衛。</p>
            </div>
            <div class="case-card warn">
              <h4>⚠️ 防衛過當（仍違法）</h4>
              <p>小偷已丟棄武器求饒，屋主仍持續猛打致重傷 → 超過必要程度，違法但得減輕或免除其刑。</p>
            </div>
          </div>
          <h2>常見誤區（挑唆防衛）</h2>
          <p>若故意激怒對方引誘攻擊再藉機傷人（意圖式挑唆），屬權利濫用，實務完全否定正當防衛；非意圖挑唆亦須限縮手段、優先迴避。</p>
        `,
        seeAlso: ["WIKI-01", "WIKI-03", "WIKI-06"]
      },
      "WIKI-03": {
        group: "wiki",
        title: "緊急避難與避難過當",
        law: "刑法第 24 條",
        sources: ["SRC-01", "SRC-03"],
        slides: [4, 6],
        tldr: "遇到突發危難時，在「別無他法」的前提下，犧牲較小的無辜法益去救較大的法益，法律例外不罰。",
        body: `
          <h2>條文原文</h2>
          <blockquote>刑法第 24 條：「因避免自己或他人生命、身體、自由、財產之緊急危難而出於不得已之行為，不罰。但避難行為過當者，得減輕或免除其刑。前項關於避免自己危難之規定，於公務上或業務上有特別義務者，不適用之。」</blockquote>
          <h2>成立要件拆解（正對正，審查最嚴格）</h2>
          <ul>
            <li><strong>緊急危難</strong>：限於<strong>生命、身體、自由、財產</strong>四種法益，危難來源不限於人（火災、地震、野狗、突發疾病皆可）。</li>
            <li><strong>出於不得已（補充性原則）</strong>：真的是「最後一招」，沒有報警、求助、其他逃生路徑等無害選項。</li>
            <li><strong>利益衡量（優越利益原則）</strong>：保全的利益必須<strong>顯然大於</strong>犧牲的利益（例如：生命 &gt; 財產）。</li>
            <li><strong>避難意思</strong>：主觀上出於避險意圖。</li>
          </ul>
          <h2>生活化正反案例</h2>
          <div class="case-grid">
            <div class="case-card ok">
              <h4>✅ 成立緊急避難</h4>
              <p>大樓火災濃煙密布，無路可逃下打破鄰居陽台玻璃逃生 → 保全生命 &gt; 毀損財產，不罰。</p>
            </div>
            <div class="case-card no">
              <h4>❌ 經濟困難偷超商</h4>
              <p>失業肚子餓去超商偷便當 → 非瞬間生命危難，且有社福管道，不符「不得已」，仍構成竊盜罪。</p>
            </div>
            <div class="case-card no">
              <h4>❌ 生命換生命</h4>
              <p>船難時搶走無辜乘客的救生衣致對方溺斃 → 生命價值相等，無優越利益，不得阻卻違法。</p>
            </div>
          </div>
          <h2>特別義務限制（§24Ⅱ）與實務見解</h2>
          <p>消防員、警察等負有特別義務者，面對職務內危難不得為「避免自己危難」主張緊急避難。<strong>最高法院 109 台上 5037 判決</strong>亦明揭：避難過當屬罪責層次之減免事由。</p>
        `,
        seeAlso: ["WIKI-01", "WIKI-02", "WIKI-06"]
      },
      "WIKI-04": {
        group: "wiki",
        title: "依法令、上級命令與業務上正當行為",
        law: "刑法第 21、22 條",
        sources: ["SRC-01", "SRC-04"],
        slides: [5],
        tldr: "其他法律允許你做的事、合法職務命令，或在正當專業規範內執行的業務，刑法不會矛盾地處罰你。",
        body: `
          <h2>三大類型與實例</h2>
          <table>
            <thead>
              <tr><th>類型與法條</th><th>核心原理與要件</th><th>生活化例子</th></tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>依法令之行為</strong><br/>（刑法 §21Ⅰ）</td>
                <td>維護「法秩序一致性」，他法既已授權，刑法不罰。</td>
                <td>民眾依刑事訴訟法 §88 逮捕現行犯；警察持票搜索民宅。</td>
              </tr>
              <tr>
                <td><strong>依上級公務員命令</strong><br/>（刑法 §21Ⅱ）</td>
                <td>職務範圍內且<strong>非明知</strong>命令違法。<br/>⚠️ 但書：<strong>明知違法仍照辦，照樣要罰！</strong></td>
                <td>基層公務員執行形式合法之行政處分（非明知違法）。</td>
              </tr>
              <tr>
                <td><strong>業務上正當行為</strong><br/>（刑法 §22）</td>
                <td>從事正當業務且遵守專業規則與社會相當性。</td>
                <td>醫師依醫療常規開刀救人；拳擊手在比賽規則內擊倒對手。</td>
              </tr>
            </tbody>
          </table>
          <div class="case-grid">
            <div class="case-card no">
              <h4>❌ 越界反例</h4>
              <p>拳擊比賽裁判已喊停，選手仍惡意重擊對手頭部 → 超出業務正當範圍，構成傷害罪。</p>
            </div>
          </div>
        `,
        seeAlso: ["WIKI-01", "WIKI-05"]
      },
      "WIKI-05": {
        group: "wiki",
        title: "超法規阻卻違法：得被害人承諾",
        law: "超法規阻卻違法事由",
        sources: ["SRC-05"],
        slides: [5],
        tldr: "只要是對方有權自己放棄的個人利益，而且事前真心同意讓你做，原則上就不違法。",
        body: `
          <h2>四大成立要件</h2>
          <ol>
            <li><strong>可處分的個人法益</strong>：✅ 財產、輕微身體（剪髮、刺青）；❌ 國家／社會法益、<strong>生命權</strong>（刑法 §275 即使對方拜託你殺他仍構成犯罪）。</li>
            <li><strong>真摯且無瑕疵</strong>：非受騙（詐欺）或被逼（脅迫）所為。</li>
            <li><strong>事前或行為時存在</strong>：事後才說「算了」不能讓原本違法的行為回溯變合法。</li>
            <li><strong>行為人主觀認知且未越界</strong>：知道對方同意並照範圍執行。</li>

    function renderNav(filter = "") {
      const q = filter.trim().toLowerCase();
      const containers = { wiki: document.getElementById("wikiNav"), raw: document.getElementById("rawNav"), meta: document.getElementById("metaNav") };
      Object.values(containers).forEach(el => el.innerHTML = "");
      Object.entries(DOCS).forEach(([id, doc]) => {
        const hay = (id + " " + doc.title + " " + doc.tldr + " " + doc.law).toLowerCase();
        if (q && !hay.includes(q)) return;
        const btn = document.createElement("button");
        btn.className = "nav-item" + (window.currentDocId === id ? " active" : "");
        btn.innerHTML = `<span class="id-pill">${id}</span><span>${doc.title}</span>`;
        btn.onclick = () => openDoc(id);
        containers[doc.group].appendChild(btn);
      });
    }

    function openDoc(id) {
      const doc = DOCS[id] || DOCS["WIKI-01"];
      window.currentDocId = DOCS[id] ? id : "WIKI-01";
      history.replaceState(null, "", "#" + window.currentDocId);
      renderNav(document.getElementById("searchInput").value);

      const srcBadges = (doc.sources || []).map(s => `<button class="badge src" onclick="openDoc('${s}')">📄 來源：${s}</button>`).join("");
      const slideBadges = (doc.slides || []).map(p => `<a class="badge slide" href="slides.html#slide-${p}">🎞️ 對應簡報第 ${p} 頁</a>`).join("");
      const seeAlsoLinks = (doc.seeAlso || []).map(t => `<button class="btn" style="padding:5px 10px;font-size:0.84rem" onclick="openDoc('${t}')">🔗 ${t} ${DOCS[t]?.title || ""}</button>`).join("");

      document.getElementById("contentArea").innerHTML = `
        <div class="meta-row">
          <span class="badge">${window.currentDocId}</span>
          <span class="badge" style="background:#f1f5f9;color:#334155;">⚖️ ${doc.law}</span>
          ${srcBadges}
          ${slideBadges}
        </div>
        <h1 style="margin:0 0 8px;font-size:1.7rem;">${doc.title}</h1>
        <div class="tldr"><strong>一句話白話重點：</strong>${doc.tldr}</div>
        ${doc.body}
        ${seeAlsoLinks ? `<div class="see-also"><strong>交叉連結（See Also）：</strong>${seeAlsoLinks}</div>` : ""}
      `;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function filterNav() {
      renderNav(document.getElementById("searchInput").value);
    }

    const initialHash = location.hash.replace("#", "");
    openDoc(DOCS[initialHash] ? initialHash : "WIKI-01");
  </script>
